<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Küp Zıplatma</title>
<style>
:root{--bg:#efedf9;--fg:#1d1a33;--muted:#5d5880;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0b1f;--fg:#ece9ff;--muted:#9a94c4}}
:root[data-theme="dark"]{--bg:#0e0b1f;--fg:#ece9ff;--muted:#9a94c4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;margin:4px 0 12px}
canvas{width:100%;max-width:900px;aspect-ratio:16/9;border-radius:10px;touch-action:none;display:block;background:#1b1440;outline:none}
p{color:var(--muted);font-size:.95rem;max-width:900px;text-align:center;margin:12px 0 0;line-height:1.5}
</style>
</head>
<body>
<h1>Küp Zıplatma</h1>
<canvas id="c" tabindex="0"></canvas>
<p>Küp: zıpla. Gemi: basılı tut yüksel, bırak alçal. Dalga: basılı tut yukarı, bırak aşağı. Örümcek: dokun, tavan ile zemin arasında ışınlan. Boşluk, ↑ veya ekrana dokun.</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=450,U=40,G=360,Cy=G-7*U,PX=160,SPD=6.2,GR=0.82,JV=-13.8;
cv.width=W;cv.height=H;
const RR={cube:20,ship:14,wave:10,spider:20},HW={cube:14,ship:14,wave:8,spider:14},HH={cube:14,ship:10,wave:8,spider:14};
const COL={cube:'#ffd23f',ship:'#ff5fa2',wave:'#5ff3ff',spider:'#ff7a45'};
const NAME={cube:'Küp',ship:'Gemi',wave:'Dalga',spider:'Örümcek'};

// Seviye (sabit tohumlu)
let seed=23;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const obs=[],secs=[];let ux=14,lastC=false;
const sp=(x,c)=>obs.push({t:'s',x,c});
const bl=(x,w,h,c)=>{if(h>0)obs.push({t:'b',x,w,h,c})};
function pattern(m){
  const r=rnd();
  if(m==='cube'){
    if(r<.16){sp(ux,0);ux+=1}
    else if(r<.30){sp(ux,0);sp(ux+1,0);ux+=2}
    else if(r<.42){for(let i=0;i<3;i++)sp(ux+i,0);ux+=3}
    else if(r<.52){for(let i=0;i<4;i++)sp(ux+i,0);ux+=4}
    else if(r<.68){const w=2+Math.floor(rnd()*3);bl(ux,w,1+Math.floor(rnd()*2),0);ux+=w}
    else if(r<.82){bl(ux,3,1,0);sp(ux+4,0);ux+=5}
    else{sp(ux,0);sp(ux+6,0);ux+=7}
    ux+=5+Math.floor(rnd()*3);
  }else if(m==='ship'||m==='wave'){
    const gap=m==='ship'?3+(rnd()<.4?.5:0):(rnd()<.4?2.5:3);
    const f=Math.round(rnd()*(7-gap)*2)/2;
    bl(ux,2,f,0);bl(ux,2,7-gap-f,1);
    ux+=2+4+Math.floor(rnd()*3);
  }else{
    const c=rnd()<.6?!lastC:lastC,k=1+Math.floor(rnd()*2);lastC=c;
    for(let i=0;i<k;i++)sp(ux+i,c);
    ux+=k+4+Math.floor(rnd()*3);
  }
}
[['cube',8],['ship',8],['cube',5],['wave',8],['spider',9],['cube',5],['ship',5],['wave',5],['spider',5],['cube',4]]
.forEach(([m,n],i)=>{
  secs.push({mode:m,x0:i?ux*U:0});
  ux+=i?8:0;
  for(let j=0;j<n;j++)pattern(m);
  ux+=4;
});
const END=(ux+4)*U;
const secAt=wx=>{let s=secs[0];for(const q of secs)if(wx>=q.x0)s=q;return s};

let state='ready',mode,d,cy,vy,rot,grounded,gdir,pressed,trail,held=false,att=1,best=0,deadT=0,parts=[];
function reset(){d=0;cy=G-20;vy=0;rot=0;grounded=true;gdir=1;pressed=false;trail=[];parts=[];mode='cube';state='play'}
reset();state='ready';

function die(){
  state='dead';deadT=0;
  best=Math.max(best,Math.min(100,Math.floor(d/END*100)));
  for(let i=0;i<26;i++){const a=Math.random()*6.28,s=2+Math.random()*6;
    parts.push({x:PX+20,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:40+Math.random()*20})}
}
const hit=(a,b,c,e,f,g,h,i)=>a<f+h&&a+c>f&&b<g+i&&b+e>g;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function update(){
  if(state==='dead'){
    deadT++;parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--});
    if(deadT>50){att++;reset()}
    return;
  }
  if(state!=='play')return;
  d+=SPD;
  const sec=secAt(d+PX+20);
  if(sec.mode!==mode){mode=sec.mode;vy=0;gdir=1;grounded=false;trail=[]}
  const R=RR[mode],lo=Cy+R,hi=G-R,prevB=cy+R;
  if(mode==='cube'){
    if(held&&grounded){vy=JV;grounded=false}
    vy+=GR;cy+=vy;grounded=false;
    if(cy>=hi){cy=hi;vy=0;grounded=true}
    if(grounded){const t=Math.round(rot/(Math.PI/2))*(Math.PI/2);rot+=(t-rot)*.4}
    else rot+=Math.PI/34;
  }else if(mode==='ship'){
    vy=clamp(vy+(held?-.62:.5),-8.5,8.5);cy+=vy;
  }else if(mode==='wave'){
    vy=held?-SPD:SPD;cy+=vy;
    trail.push(clamp(cy,lo,hi));if(trail.length>40)trail.shift();
  }else{
    if(pressed&&grounded){gdir=-gdir;vy=0;cy=gdir>0?hi:lo}
    else{
      vy=clamp(vy+GR*gdir,-18,18);cy+=vy;grounded=false;
      if(gdir>0&&cy>=hi){cy=hi;vy=0;grounded=true}
      if(gdir<0&&cy<=lo){cy=lo;vy=0;grounded=true}
    }
  }
  pressed=false;
  if(mode==='ship'||mode==='wave'){
    if(cy<lo){cy=lo;vy=0}
    if(cy>hi){cy=hi;vy=0}
  }
  const hw=HW[mode],hh=HH[mode],hx=PX+20-hw,hy=cy-hh;
  for(const o of obs){
    const sx=o.x*U-d,w=(o.w||1)*U;
    if(sx>W||sx+w<PX-10)continue;
    if(o.t==='s'){
      if(hit(hx,hy,hw*2,hh*2,sx+11,o.c?Cy:G-26,18,26)){die();return}
    }else{
      const bh=o.h*U,by=o.c?Cy:G-bh;
      if(mode==='cube'){
        if(PX+U-3>sx&&PX+3<sx+w&&cy+20>by&&cy-20<by+bh){
          if(prevB<=by+2&&vy>=0){cy=by-20;vy=0;grounded=true}
          else{die();return}
        }
      }else if(hit(hx,hy,hw*2,hh*2,sx,by,w,bh)){die();return}
    }
  }
  if(d>=END){state='won';best=100}
}

function drawPlayer(){
  ctx.save();ctx.translate(PX+20,cy);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  if(mode==='cube'){
    ctx.rotate(rot);ctx.fillStyle=COL.cube;ctx.fillRect(-20,-20,40,40);ctx.strokeRect(-19,-19,38,38);
    ctx.fillStyle='#1a1530';ctx.fillRect(-11,-9,8,8);ctx.fillRect(3,-9,8,8);ctx.fillRect(-10,7,20,4);
  }else if(mode==='ship'){
    ctx.rotate(vy*.05);
    ctx.fillStyle=COL.cube;ctx.fillRect(-7,-15,14,12);ctx.strokeRect(-7,-15,14,12);
    ctx.fillStyle=COL.ship;ctx.beginPath();ctx.moveTo(-22,-2);ctx.lineTo(24,-2);ctx.lineTo(14,12);ctx.lineTo(-16,12);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(mode==='wave'){
    ctx.rotate(Math.atan2(vy,SPD));
    ctx.fillStyle=COL.wave;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-12,-10);ctx.lineTo(-12,10);ctx.closePath();ctx.fill();ctx.stroke();
  }else{
    if(gdir<0)ctx.scale(1,-1);
    ctx.strokeStyle=COL.spider;ctx.lineWidth=4;
    for(const k of [-12,-4,4,12]){ctx.beginPath();ctx.moveTo(k,8);ctx.lineTo(k*1.7,20);ctx.stroke()}
    ctx.fillStyle='#2a1438';ctx.fillRect(-16,-16,32,28);ctx.lineWidth=2;ctx.strokeRect(-16,-16,32,28);
    ctx.fillStyle='#fff';ctx.fillRect(-10,-8,8,8);ctx.fillRect(2,-8,8,8);
    ctx.fillStyle=COL.spider;ctx.fillRect(-7,-5,3,4);ctx.fillRect(5,-5,3,4);
  }
  ctx.restore();
}

function draw(){
  const prog=Math.min(1,d/END),h=250+prog*90;
  const g=ctx.createLinearGradient(0,0,0,G);
  g.addColorStop(0,`hsl(${h} 55% 14%)`);g.addColorStop(1,`hsl(${h+25} 65% 30%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`hsla(${h+30} 80% 70% / .08)`;
  for(let i=0;i<14;i++){
    const s=50+(i*37)%70,x=((i*173-d*(.15+(i%3)*.08))%(W+120)+W+120)%(W+120)-60;
    ctx.fillRect(x,40+(i*61)%240,s,s);
  }
  const edge=`hsl(${h+40} 90% 70%)`,slab=`hsl(${h} 45% 8%)`;
  ctx.fillStyle=slab;ctx.fillRect(0,G,W,H-G);
  ctx.strokeStyle=edge;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();
  ctx.strokeStyle=`hsla(${h+40} 90% 70% / .18)`;ctx.lineWidth=1;
  for(let x=-(d%U);x<W;x+=U){ctx.beginPath();ctx.moveTo(x,G);ctx.lineTo(x,H);ctx.stroke()}
  // tavan ve portallar
  secs.forEach((s,i)=>{
    const x0=s.x0-d,x1=(secs[i+1]?secs[i+1].x0:END)-d;
    if(s.mode!=='cube'&&x1>0&&x0<W){
      const a=Math.max(0,x0),b=Math.min(W,x1);
      ctx.fillStyle=slab;ctx.fillRect(a,0,b-a,Cy);
      ctx.strokeStyle=edge;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a,Cy);ctx.lineTo(b,Cy);ctx.stroke();
    }
    if(i&&x0>-30&&x0<W+30){
      ctx.strokeStyle=COL[s.mode];ctx.lineWidth=6;
      ctx.beginPath();ctx.ellipse(x0,(Cy+G)/2,16,(G-Cy)/2,0,0,6.29);ctx.stroke();
    }
  });
  if(mode==='wave'&&trail.length){
    ctx.strokeStyle='rgba(95,243,255,.7)';ctx.lineWidth=5;ctx.lineJoin='round';ctx.beginPath();
    for(let i=0;i<trail.length;i++){const x=PX+20-(trail.length-1-i)*SPD;i?ctx.lineTo(x,trail[i]):ctx.moveTo(x,trail[i])}
    ctx.stroke();
  }
  for(const o of obs){
    const sx=o.x*U-d,w=(o.w||1)*U;
    if(sx>W||sx+w<-10)continue;
    if(o.t==='s'){
      ctx.fillStyle='#0a0a14';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();
      if(o.c){ctx.moveTo(sx+2,Cy);ctx.lineTo(sx+U/2,Cy+U-2);ctx.lineTo(sx+U-2,Cy)}
      else{ctx.moveTo(sx+2,G);ctx.lineTo(sx+U/2,G-U+2);ctx.lineTo(sx+U-2,G)}
      ctx.closePath();ctx.fill();ctx.stroke();
    }else{
      const rows=Math.ceil(o.h),bh=o.h*U;
      ctx.save();ctx.beginPath();ctx.rect(sx,o.c?Cy:G-bh,w,bh);ctx.clip();
      for(let r=0;r<rows;r++)for(let c=0;c<o.w;c++){
        const bx=sx+c*U,by=o.c?Cy+r*U:G-(r+1)*U;
        ctx.fillStyle='#0d0f26';ctx.fillRect(bx,by,U,U);
        ctx.strokeStyle='#5ff3ff';ctx.lineWidth=2;ctx.strokeRect(bx+1,by+1,U-2,U-2);
        ctx.strokeStyle='rgba(95,243,255,.3)';ctx.strokeRect(bx+10,by+10,U-20,U-20);
      }
      ctx.restore();
    }
  }
  if(state!=='dead')drawPlayer();
  parts.forEach(p=>{if(p.l>0){ctx.fillStyle=COL[mode];ctx.fillRect(p.x,p.y,7,7)}});
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(W/2-150,16,300,10);
  ctx.fillStyle='#5ff3ff';ctx.fillRect(W/2-150,16,300*prog,10);
  ctx.fillStyle='#fff';ctx.font='bold 16px "Trebuchet MS",sans-serif';ctx.textAlign='center';
  ctx.fillText('%'+Math.floor(prog*100),W/2,46);
  ctx.textAlign='right';ctx.fillText('En iyi: %'+best,W-16,30);
  ctx.textAlign='left';ctx.fillText('Deneme '+att,16,30);
  ctx.fillStyle=COL[mode];ctx.fillText(NAME[mode],16,52);
  if(d<500&&state!=='ready'){ctx.fillStyle='#fff';ctx.font='bold 34px "Trebuchet MS",sans-serif';ctx.fillText('Deneme '+att,PX+240-d,Cy+10+60)}
  ctx.textAlign='center';
  if(state==='ready'||state==='won'){
    ctx.fillStyle='rgba(8,6,24,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 40px "Trebuchet MS",sans-serif';
    ctx.fillText(state==='won'?'Seviye tamam!':'Küp Zıplatma',W/2,190);
    ctx.font='18px "Trebuchet MS",sans-serif';
    ctx.fillText(state==='won'?'Tekrar oynamak için dokun veya Boşluğa bas':'Başlamak için dokun veya Boşluğa bas',W/2,230);
    if(state==='ready')ctx.fillText('Küp, Gemi, Dalga ve Örümcek modları',W/2,262);
  }
}

function press(){
  held=true;
  if(state==='ready')reset();
  else if(state==='won'){att=1;reset()}
  pressed=true;
}
const release=()=>{held=false};
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press();else held=true}
});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))release()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();press()});
addEventListener('pointerup',release);
addEventListener('blur',release);

let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){update();acc-=1000/60}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
